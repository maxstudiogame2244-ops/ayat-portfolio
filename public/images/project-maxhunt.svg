<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 380' width='600' height='380'>
    <defs>
      <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
        <stop offset='0%' stop-color='#0a140f'/>
        <stop offset='50%' stop-color='#060d09'/>
        <stop offset='100%' stop-color='#030705'/>
      </linearGradient>
      <linearGradient id='accentGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
        <stop offset='0%' stop-color='#34d399'/>
        <stop offset='100%' stop-color='#10b981'/>
      </linearGradient>
      <linearGradient id='borderGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
        <stop offset='0%' stop-color='rgba(16, 185, 129, 0.6)'/>
        <stop offset='50%' stop-color='rgba(16, 185, 129, 0.2)'/>
        <stop offset='100%' stop-color='rgba(52, 211, 153, 0.5)'/>
      </linearGradient>
      <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
        <feGaussianBlur stdDeviation='12' result='blur' />
        <feComposite in='SourceGraphic' in2='blur' operator='over'/>
      </filter>
      <pattern id='grid' width='24' height='24' patternUnits='userSpaceOnUse'>
        <path d='M 24 0 L 0 0 0 24' fill='none' stroke='rgba(16, 185, 129, 0.07)' stroke-width='1'/>
      </pattern>
    </defs>
    
    <!-- Background Card -->
    <rect width='600' height='380' rx='24' fill='url(#bgGrad)'/>
    <rect width='600' height='380' rx='24' fill='url(#grid)'/>
    <rect width='598' height='378' x='1' y='1' rx='23' fill='none' stroke='url(#borderGrad)' stroke-width='2'/>
    
    <!-- Ambient Green Glow Circle -->
    <circle cx='500' cy='90' r='120' fill='#10b981' opacity='0.12' filter='url(#glow)'/>
    <circle cx='100' cy='290' r='90' fill='#34d399' opacity='0.08' filter='url(#glow)'/>

    <!-- Badge -->
    <rect x='40' y='36' width='152' height='28' rx='14' fill='rgba(16, 185, 129, 0.15)' stroke='rgba(52, 211, 153, 0.4)' stroke-width='1'/>
    <text x='52' y='55' fill='#34d399' font-family='sans-serif' font-size='12' font-weight='600' letter-spacing='1'>MINECRAFT PLUGIN</text>

    <!-- Icon Area -->
    <g transform='translate(480, 40)'>
      <circle cx='40' cy='40' r='36' fill='rgba(16, 185, 129, 0.1)' stroke='rgba(16, 185, 129, 0.3)' stroke-width='1.5'/>
      <polygon points='40,22 55,55 40,46 25,55' fill='#10b981'/>
    </g>

    <!-- Title & Subtitle -->
    <text x='40' y='140' fill='#ffffff' font-family='sans-serif' font-size='32' font-weight='700' letter-spacing='0.5'>Max Hunt (Spigot/Paper)</text>
    <text x='40' y='175' fill='#9ca3af' font-family='sans-serif' font-size='15' font-weight='400'>Next-gen Manhunt multiplayer mini-game published on CurseForge & Modrinth.</text>

    <!-- Decorative separator -->
    <line x1='40' y1='215' x2='560' y2='215' stroke='rgba(255, 255, 255, 0.1)' stroke-dasharray='4,4'/>

    <!-- Tags -->
    <g transform='translate(40, 245)'>
      <g transform='translate(0, 0)'>
      <rect width='105' height='32' rx='16' fill='rgba(255, 255, 255, 0.05)' stroke='rgba(16, 185, 129, 0.25)' stroke-width='1'/>
      <text x='52' y='21' fill='#d1fae5' font-family='sans-serif' font-size='12' font-weight='500' text-anchor='middle'>Java</text>
    </g><g transform='translate(115, 0)'>
      <rect width='105' height='32' rx='16' fill='rgba(255, 255, 255, 0.05)' stroke='rgba(16, 185, 129, 0.25)' stroke-width='1'/>
      <text x='52' y='21' fill='#d1fae5' font-family='sans-serif' font-size='12' font-weight='500' text-anchor='middle'>Bukkit/Spigot</text>
    </g><g transform='translate(230, 0)'>
      <rect width='105' height='32' rx='16' fill='rgba(255, 255, 255, 0.05)' stroke='rgba(16, 185, 129, 0.25)' stroke-width='1'/>
      <text x='52' y='21' fill='#d1fae5' font-family='sans-serif' font-size='12' font-weight='500' text-anchor='middle'>Paper API</text>
    </g><g transform='translate(345, 0)'>
      <rect width='105' height='32' rx='16' fill='rgba(255, 255, 255, 0.05)' stroke='rgba(16, 185, 129, 0.25)' stroke-width='1'/>
      <text x='52' y='21' fill='#d1fae5' font-family='sans-serif' font-size='12' font-weight='500' text-anchor='middle'>Modrinth</text>
    </g>
    </g>

    <!-- Status indicator at bottom -->
    <circle cx='48' cy='330' r='5' fill='#10b981'/>
    <text x='62' y='334' fill='#6ee7b7' font-family='sans-serif' font-size='13' font-weight='600' letter-spacing='0.5'>Production Ready • Engineered by Ayat</text>
  </svg>